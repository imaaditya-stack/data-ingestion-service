x-common-environment: &common-environment # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # Vector Store Configuration
  VECTOR_DB_PATH: /app/data/chroma_db
  VECTOR_DB_USE_REMOTE: true
  VECTOR_DB_REMOTE_HOST: vector-database
  VECTOR_DB_REMOTE_PORT: 8000
  COLLECTION_NAME: networking-platform

  # Ollama (for embeddings)
  OLLAMA_BASE_URL: http://host.docker.internal:11434

  DRY_RUN_MODE: true

x-common-service: &common-service
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./src:/app/src
    - ./alembic:/app/alembic
    - ./alembic.ini:/app/alembic.ini
  networks:
    - kafka-net
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    <<: *common-environment
  depends_on:
    - vector-database
    - rdbms-database

services:
  vector-database:
    image: chromadb/chroma:latest
    container_name: vector-database
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    volumes:
      - ./chroma_data:/data
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/collections"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-backend:
    <<: *common-service
    container_name: ai-backend
    ports:
      - "8000:8000"
    environment:
      <<: *common-environment
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@rdbms-database:3306/${MYSQL_DATABASE}

  kafka-consumer-for-data-ingestion:
    <<: *common-service
    container_name: kafka-consumer-for-data-ingestion
    command: ["python", "-m", "src.kafka_consumer_runner"]

  rdbms-database:
    image: mysql:lts
    container_name: rdbms-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  kafka-net:
    external: true
    name: kafka-net
