services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000" # Expose Chroma API externally if needed
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    volumes:
      - ./chroma_data:/data
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/collections"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  data-ingestion-service:
    container_name: data-ingestion-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # Vector Store Configuration
      VECTOR_DB_PATH: /app/data/chroma_db
      VECTOR_DB_USE_REMOTE: true
      VECTOR_DB_REMOTE_HOST: chromadb
      VECTOR_DB_REMOTE_PORT: 8000
      COLLECTION_NAME: networking-platform
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DRY_RUN_MODE: true
    volumes:
      - ./src:/app/src
    depends_on:
      - chromadb
    networks:
      - kafka-net
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  kafka-net:
    external: true
    name: kafka-net
